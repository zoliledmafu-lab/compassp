<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw; height: 100vh;
    background: transparent;
    overflow: hidden;
    pointer-events: none;
  }
  svg {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    pointer-events: none;
  }
  .annotation-group { animation: fadeIn 0.3s ease-out; }
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.8); }
    to   { opacity: 1; transform: scale(1); }
  }
  .pulse-circle {
    animation: pulse 1.2s ease-in-out infinite;
    transform-origin: center;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.8; r: 18px; }
    50%       { opacity: 0.3; r: 28px; }
  }
  .step-badge {
    animation: pop 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes pop {
    from { transform: scale(0); }
    to   { transform: scale(1); }
  }
  .connector-line {
    stroke-dasharray: 6 3;
    animation: dash 1s linear infinite;
  }
  @keyframes dash {
    to { stroke-dashoffset: -18; }
  }
</style>
</head>
<body>
  <svg id="overlay" xmlns="http://www.w3.org/2000/svg"></svg>

<script>
  const svg = document.getElementById('overlay')
  const W   = window.innerWidth
  const H   = window.innerHeight

  function clear() {
    while (svg.firstChild) svg.removeChild(svg.firstChild)
  }

  function renderAnnotations(targets) {
    clear()
    if (!targets || !targets.length) return

    // If multiple targets, draw step-connecting lines first (behind everything)
    if (targets.length > 1) {
      for (let i = 0; i < targets.length - 1; i++) {
        const a = toXY(targets[i])
        const b = toXY(targets[i + 1])
        const line = el('line', {
          x1: a.x, y1: a.y, x2: b.x, y2: b.y,
          stroke: 'rgba(245,158,11,0.3)',
          'stroke-width': '1.5',
          class: 'connector-line',
        })
        svg.appendChild(line)
      }
    }

    targets.forEach((t, i) => {
      const { x, y } = toXY(t)
      const g = el('g', { class: 'annotation-group', style: `animation-delay: ${i * 0.12}s` })

      // Outer pulse ring
      const pulse = el('circle', {
        cx: x, cy: y, r: 22,
        fill: 'none',
        stroke: '#f59e0b',
        'stroke-width': '1.5',
        opacity: '0.5',
        class: 'pulse-circle',
        style: `animation-delay: ${i * 0.3}s`,
      })
      g.appendChild(pulse)

      // Solid inner dot
      g.appendChild(el('circle', { cx: x, cy: y, r: 10, fill: 'rgba(245,158,11,0.25)', stroke: 'none' }))

      // Step number badge
      const badge = el('g', { class: 'step-badge', style: `transform-origin: ${x}px ${y}px; animation-delay: ${i * 0.12 + 0.1}s` })
      badge.appendChild(el('circle', { cx: x, cy: y, r: 11, fill: '#f59e0b' }))
      const num = el('text', {
        x, y: y + 4,
        'text-anchor': 'middle',
        fill: '#000',
        'font-size': '10',
        'font-weight': 'bold',
        'font-family': 'system-ui, -apple-system, sans-serif',
      })
      num.textContent = String(i + 1)
      badge.appendChild(num)
      g.appendChild(badge)

      // Label
      if (t.label) {
        const label    = t.label
        const charW    = 6.4
        const padX     = 10
        const padY     = 4
        const boxW     = label.length * charW + padX * 2
        const boxH     = 18
        const lx       = clamp(x - boxW / 2, 4, W - boxW - 4)
        const ly       = y + 18

        g.appendChild(el('rect', {
          x: lx, y: ly,
          width: boxW, height: boxH,
          rx: 4,
          fill: 'rgba(15,15,26,0.88)',
          stroke: '#f59e0b',
          'stroke-width': '0.8',
        }))
        const lbl = el('text', {
          x: lx + boxW / 2,
          y: ly + boxH - padY,
          'text-anchor': 'middle',
          fill: '#f59e0b',
          'font-size': '10',
          'font-family': 'system-ui, -apple-system, sans-serif',
        })
        lbl.textContent = label
        g.appendChild(lbl)
      }

      // Action indicator badge (top-right of circle)
      if (t.action && t.action !== 'highlight') {
        const ax = x + 12
        const ay = y - 12
        g.appendChild(el('circle', { cx: ax, cy: ay, r: 7, fill: '#1e40af' }))
        const aIcons = { click: '↵', 'double-click': '⊛', 'right-click': '☰', type: 'T', scroll: '⇕' }
        const aIcon  = el('text', {
          x: ax, y: ay + 3,
          'text-anchor': 'middle',
          fill: '#fff',
          'font-size': '7',
          'font-family': 'system-ui',
        })
        aIcon.textContent = aIcons[t.action] || '•'
        g.appendChild(aIcon)
      }

      svg.appendChild(g)
    })
  }

  function toXY(t) {
    return {
      x: t.x <= 1 ? t.x * W : t.x,
      y: t.y <= 1 ? t.y * H : t.y,
    }
  }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)) }

  function el(tag, attrs) {
    const e = document.createElementNS('http://www.w3.org/2000/svg', tag)
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, String(v))
    return e
  }

  if (window.electronAPI) {
    window.electronAPI.onAnnotate(targets => renderAnnotations(targets))
    window.electronAPI.onClearAnnotations(() => clear())
  }
</script>
</body>
</html>
