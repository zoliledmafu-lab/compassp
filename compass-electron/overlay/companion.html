<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 80px; height: 80px;
    background: transparent;
    overflow: hidden;
    user-select: none;
  }

  #dot {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 2.5px solid rgba(255,255,255,0.15);
    background: rgba(15,15,26,0.5);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    transition: border-color 0.2s, background 0.2s, transform 0.15s;
  }

  /* States */
  body.idle     #dot { border-color: rgba(255,255,255,0.18); }
  body.listening #dot {
    border-color: #ef4444;
    background: rgba(239,68,68,0.15);
    transform: translate(-50%,-50%) scale(1.15);
    animation: pulse-red 0.8s ease-in-out infinite alternate;
  }
  body.thinking #dot {
    border-color: #3b82f6;
    background: rgba(59,130,246,0.15);
  }
  body.speaking #dot {
    border-color: #22c55e;
    background: rgba(34,197,94,0.12);
  }

  /* Outer ring for listening */
  #ring {
    position: absolute;
    top: 50%; left: 50%;
    width: 50px; height: 50px;
    border-radius: 50%;
    border: 1.5px solid rgba(239,68,68,0);
    transform: translate(-50%,-50%);
    transition: border-color 0.2s;
    pointer-events: none;
  }
  body.listening #ring {
    border-color: rgba(239,68,68,0.4);
    animation: expand-ring 1s ease-out infinite;
  }

  /* Spinner for thinking */
  #spinner {
    display: none;
    position: absolute;
    top: 50%; left: 50%;
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: #3b82f6;
    transform: translate(-50%,-50%);
    animation: spin 0.8s linear infinite;
  }
  body.thinking #spinner { display: block; }

  /* Wave bars for speaking */
  #waves {
    display: none;
    position: absolute;
    bottom: 6px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 2px; align-items: flex-end;
  }
  body:not(.speaking) #waves { display: none; }
  body.speaking #waves { display: flex; }
  .wave-bar {
    width: 3px; border-radius: 2px; background: #22c55e;
    animation: wave-bar 0.5s ease-in-out infinite alternate;
  }
  .wave-bar:nth-child(1) { height: 6px;  animation-delay: 0s; }
  .wave-bar:nth-child(2) { height: 10px; animation-delay: 0.1s; }
  .wave-bar:nth-child(3) { height: 14px; animation-delay: 0.2s; }
  .wave-bar:nth-child(4) { height: 10px; animation-delay: 0.1s; }
  .wave-bar:nth-child(5) { height: 6px;  animation-delay: 0s; }

  @keyframes pulse-red {
    from { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); }
    to   { box-shadow: 0 0 0 8px rgba(239,68,68,0); }
  }
  @keyframes expand-ring {
    0%   { transform: translate(-50%,-50%) scale(0.8); opacity: 0.8; }
    100% { transform: translate(-50%,-50%) scale(1.5); opacity: 0; }
  }
  @keyframes spin {
    to { transform: translate(-50%,-50%) rotate(360deg); }
  }
  @keyframes wave-bar {
    from { transform: scaleY(0.5); }
    to   { transform: scaleY(1.2); }
  }
</style>
</head>
<body class="idle">
  <div id="ring"></div>
  <div id="dot">
    <span id="icon">◈</span>
  </div>
  <div id="spinner"></div>
  <div id="waves">
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
  </div>

<script>
  const body = document.body
  const icon = document.getElementById('icon')

  const ICONS = { idle: '◈', listening: '●', thinking: '…', speaking: '♪', off: '◈' }

  if (window.electronAPI) {
    window.electronAPI.onStateChange(state => {
      body.className = state === 'off' ? 'idle' : state
      icon.textContent = ICONS[state] || '◈'
    })
  }
</script>
</body>
</html>
